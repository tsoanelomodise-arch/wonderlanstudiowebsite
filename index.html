
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Wonderland Studio — Modern Digital Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,700;0,800;0,900;1,800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      background: #FAFAF8;
      color: #111111;
      overflow-x: hidden;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
    .stagger-reveal > * {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stagger-reveal.active > * {
      opacity: 1;
      transform: translateY(0);
    }
    /* Stagger delays */
    .stagger-reveal.active > *:nth-child(1) { transition-delay: 0.1s; }
    .stagger-reveal.active > *:nth-child(2) { transition-delay: 0.2s; }
    .stagger-reveal.active > *:nth-child(3) { transition-delay: 0.3s; }
    .stagger-reveal.active > *:nth-child(4) { transition-delay: 0.4s; }
    .stagger-reveal.active > *:nth-child(5) { transition-delay: 0.5s; }

    /* Halftone dot texture background overlay */
    .halftone-overlay {
      background-image: radial-gradient(rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    /* Soft grain texture */
    .grain-pattern {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.04);
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03);
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Syne', 'sans-serif'],
            serif: ['Syne', 'Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#111111',
              light: '#f5f5f3',
              dark: '#000000',
              gold: '#111111',
            }
          },
          borderRadius: {
            '2xl': '1.5rem',
            '3xl': '2rem',
            '4xl': '3rem',
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
</head>
<body class="bg-[#FAFAF8] text-[#111111] selection:bg-black selection:text-white antialiased">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
